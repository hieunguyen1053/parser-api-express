name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitLab Registry
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: gitlab-ci-token
          password: ${{ secrets.GITLAB_TOKEN }}

      - name: Set Docker build outputs
        id: docker-build-outputs
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tags=${{ secrets.GITLAB_IMAGE }}:dev,${{ secrets.GITLAB_IMAGE }}:${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "target=builder" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tags=${{ secrets.GITLAB_IMAGE }}:${{ github.ref_name }},${{ secrets.GITLAB_IMAGE }}:latest" >> $GITHUB_OUTPUT
            echo "target=production" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          push: true
          target: ${{ steps.docker-build-outputs.outputs.target }}
          tags: ${{ steps.docker-build-outputs.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
